{% extends "base.html" %}
{% block title %}Create account | SecureGate{% endblock %}
{% block content %}
<section class="card">
  <h1>Create account</h1>
  <p class="muted">Register with a unique username and a strong password.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autocomplete="username">
    <label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="email">
    <label for="password">Password</label><input id="password" type="password" name="password" required minlength="8" autocomplete="new-password">
    <label for="confirm_password">Confirm password</label><input id="confirm_password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
    <button class="full" type="submit">Create account</button>
  </form>
  <p class="foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  <p class="small">Passwords are stored as password hashes, not plain text.</p>
</section>
{% endblock %}
